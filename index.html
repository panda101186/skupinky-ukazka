<body>
<title>Skupinky plavání · ukázka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root {
  /* Centrum péče: hnědá ink + písková plocha, bílé karty, akcenty z webu (text na nich vždy ink) */
  --bg: #f8f2ec; --panel: #ffffff; --line: #eaddd2; --line2: #f3ebe4; --sand: #d9ae8c; --sand-soft: #f4e9df;
  --ink: #5c4438; --ink-strong: #3c2d25; --ink2: #7a6155; --ink3: #a48e82; --on-ink: #ffffff;
  --accent: #5c4438; --accent-2: #88d6de; --accent-soft: #e6f6f8; --blue: #88d6de; --green: #bedf64; --yellow: #e2e479; --orange: #e6a365; --pink: #e481c9;
  --terracotta: #9c3829;
  --good: #4d6b12; --good-soft: #eef6d6; --warn: #8a5a12; --warn-soft: #fbefd9; --bad: #bd4247; --bad-soft: #fbe5e5;
  --new: #6f9a1c; --new-soft: #eef6d6; --ret: #2b8c96; --ret-soft: #e2f4f6; --sub: #b4581f; --sub-soft: #fbe8db;
  --katka: #b0418a; --zuzka: #9c3829; --majda: #2b8c96; --iveta: #5f8a12; --dana: #b07a10; --jina: #7a6155;
  --r: 12px; --shadow: 0 1px 2px rgba(92,68,56,.06), 0 6px 18px rgba(92,68,56,.06);
  font-family: Poppins, "Segoe UI", system-ui, -apple-system, sans-serif;
  color: var(--ink); font-size: 13.5px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); }
#app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--ink2); } .small { font-size: 12px; } .tiny { font-size: 11px; color: var(--ink3); }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; } h2 { font-size: 16px; margin: 0 0 12px; } h3 { font-size: 14px; margin: 0 0 8px; }

/* ---------- sidebar */
.side { background: #0b2533; color: #d6e6ee; padding: 18px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px; }
.brand b { display: block; font-size: 16px; color: #fff; } .brand small { color: #8fb3c4; font-size: 11.5px; }
.kurz-switch { display: flex; gap: 6px; }
.kurz-switch select { flex: 1; background: #12384a; border: 1px solid #1d4d63; color: #fff; border-radius: 9px; padding: 8px 10px; }
.icon { width: 36px; border-radius: 9px; border: 1px solid #1d4d63; background: #12384a; color: #fff; cursor: pointer; font-size: 18px; }
nav { display: flex; flex-direction: column; gap: 2px; }
nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: #b7d0dc; text-decoration: none; cursor: pointer; }
nav a:hover { background: #12384a; color: #fff; }
nav a.on { background: #155e75; color: #fff; }
nav .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; background: #12384a; border: 1px solid #2a5f78; flex: none; }
nav a.done .num { background: #14b8a6; border-color: #14b8a6; color: #06303a; }
nav .cnt { margin-left: auto; font-size: 11px; background: #b45309; color: #fff; padding: 1px 7px; border-radius: 10px; }
.side-foot { margin-top: auto; font-size: 11.5px; color: #7fa2b3; line-height: 1.5; }

/* ---------- main */
main { padding: 22px 24px 60px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
.top p { margin: 4px 0 0; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 9px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: #c7d1dc; background: #fbfcfd; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #0b6178; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 16px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; transition: border-color .15s; }
.kpi:hover, .kpi.on { border-color: var(--accent-2); }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--ink2); font-size: 12.5px; margin-top: 2px; }
.kpi .bar { height: 4px; border-radius: 3px; margin-top: 10px; background: var(--line2); overflow: hidden; }
.kpi .bar i { display: block; height: 100%; }

/* badges */
.b { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 550; white-space: nowrap; }
.b.pokr { background: #eef2f6; color: var(--ink2); } .b.vraci { background: var(--ret-soft); color: var(--ret); }
.b.novy { background: var(--new-soft); color: var(--new); } .b.sub { background: var(--sub-soft); color: var(--sub); }
.b.bad { background: var(--bad-soft); color: var(--bad); } .b.warn { background: var(--warn-soft); color: var(--warn); } .b.good { background: var(--good-soft); color: var(--good); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* table */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl th { text-align: left; font-weight: 550; font-size: 12px; color: var(--ink2); padding: 9px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line2); vertical-align: top; }
.tbl tr:hover td { background: #f8fafc; }
.num { font-variant-numeric: tabular-nums; }
.search { border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; min-width: 240px; background: #fff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* import */
.drop { border: 2px dashed #b9cad8; border-radius: 16px; padding: 30px; text-align: center; background: #fbfdfe; transition: .15s; cursor: pointer; }
.drop.over { border-color: var(--accent-2); background: var(--accent-soft); }
.drop svg { color: var(--accent); }
.filecard { display: flex; gap: 14px; align-items: flex-start; }
.filecard .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; }
.filecard.missing .ic { background: #f1f5f9; color: var(--ink3); }
.errs { margin: 8px 0 0; padding-left: 18px; color: var(--bad); font-size: 12.5px; }

/* timetable grid */
.tt { display: grid; grid-template-columns: 48px repeat(5, minmax(150px, 1fr)); gap: 6px; }
.tt .hd { font-weight: 600; font-size: 12.5px; text-align: center; padding: 6px; color: var(--ink2); letter-spacing: .04em; }

<script>/* Ukázková verze Skupinek – místo serveru běží vše v prohlížeči nad předpočítanými daty. */
(function () {
  const RAW = JSON.parse(document.getElementById("demo-data").textContent);
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const DNY = ["PONDĚLÍ", "ÚTERÝ", "STŘEDA", "ČTVRTEK", "PÁTEK"];
  const DOP = ["08:30", "09:10", "09:50", "10:30", "11:10", "11:50"];
  const ODP = ["13:20", "14:00", "14:40", "15:20", "16:00", "16:45"];
  const kap = (u) => (u || "").startsWith("POKR") ? 5 : 4;
  const now = () => new Date().toISOString().slice(0, 19);

  const ST = {
    kurz: clone(RAW.kurz), soubory: RAW.soubory, analyza: clone(RAW.analyza), kostra: clone(RAW.kostra),
    varianty: clone(RAW.varianty), rozpis: clone(RAW.rozpisy.vyvazena), job: null, profily: RAW.profily,
    verze: [{ id: 1, popis: "Varianta Vyvážená", vytvoreno: "2026-10-14T20:05:00", data: clone(RAW.rozpisy.vyvazena) }],
  };

  function kontrola(skupiny, deti, kostra) {
    const dm = Object.fromEntries(deti.map((d) => [d.id, d])), out = [], obs = {};
    for (const g of skupiny) {
      const k = g.den + "|" + g.cas;
      if (obs[k]) out.push({ uroven: "chyba", skupina: g.id, text: `${g.den.slice(0, 2)} ${g.cas}: dvě skupiny ve stejném čase` });
      obs[k] = g;
      const n = g.deti.length;
      if (n > g.kapacita) out.push({ uroven: "chyba", skupina: g.id, text: `${g.den.slice(0, 2)} ${g.cas} ${g.uroven} ${g.lektorka}: ${n}/${g.kapacita} – překročená kapacita` });
      else if (n > 0 && n < 3) out.push({ uroven: "varovani", skupina: g.id, text: `${g.den.slice(0, 2)} ${g.cas} ${g.uroven} ${g.lektorka}: jen ${n} ${n === 1 ? "dítě" : "děti"} – malá skupina` });
      const c = (kostra || {})[k] || {};
      if (c.blokace) out.push({ uroven: "chyba", skupina: g.id, text: `${g.den.slice(0, 2)} ${g.cas}: čas je blokovaný (${c.blokace})` });
      const v = g.deti.map((i) => dm[i]?.vek).filter((x) => x != null);
      if (v.length >= 2) { const mx = Math.max(...v), mn = Math.min(...v); if (mx - mn > (mx < 24 ? 8 : 14)) out.push({ uroven: "varovani", skupina: g.id, text: `${g.den.slice(0, 2)} ${g.cas} ${g.uroven}: velký rozptyl věku (${Math.round(mn)}–${Math.round(mx)} m)` }); }
    }
    for (const d of DNY) for (const [half, nm] of [[DOP, "dop."], [ODP, "odp."]]) {
      const lek = new Set(half.map((t) => obs[d + "|" + t]?.lektorka).filter(Boolean));
      for (const l of lek) {
        let r = 0; const runs = [];
        for (const t of half) { if (obs[d + "|" + t]?.lektorka === l) r++; else { if (r) runs.push(r); r = 0; } }
        if (r) runs.push(r);
        runs.filter((x) => x < 3).forEach((x) => out.push({ uroven: "chyba", skupina: null, text: `${d.charAt(0) + d.slice(1).toLowerCase()} ${nm} ${l}: blok jen ${x} lekce za sebou (min. 3)` }));
      }
    }
    const seen = {};
    for (const g of skupiny) for (const i of g.deti) { if (seen[i]) out.push({ uroven: "chyba", skupina: g.id, text: `${dm[i]?.jmeno || i} je ve dvou skupinách` }); seen[i] = 1; }
    return out;
  }

  function stav() {
    return clone({
      kurz: ST.kurz, soubory: ST.soubory, analyza: ST.analyza, kostra: ST.kostra, varianty: ST.varianty, rozpis: ST.rozpis,
      kontrola: ST.rozpis ? kontrola(ST.rozpis.skupiny, ST.rozpis.deti, ST.kostra) : [], job: ST.job,
      verze: ST.verze.map(({ id, popis, vytvoreno }) => ({ id, popis, vytvoreno })).reverse(), profily: ST.profily,
    });
  }

  async function api(path, opt = {}) {
    await new Promise((r) => setTimeout(r, 60));
    const m = (opt.method || (opt.json !== undefined ? "POST" : "GET")).toUpperCase();
    const body = opt.json;
    const p = path.replace(/^\/api\/kurzy\/\d+/, "");
    if (path === "/api/kurzy" && m === "GET") return [{ id: 1, nazev: ST.kurz.nazev, zacatek: ST.kurz.zacatek }];
    if (path === "/api/kurzy" && m === "POST") throw new Error("V ukázce nejde zakládat další kurzy");
    if (p === "/stav") return stav();
    if (p === "" && m === "PATCH") {
      if (body.nazev) ST.kurz.nazev = body.nazev; if (body.zacatek) ST.kurz.zacatek = body.zacatek;
      if (body.volne_dny) ST.kurz.nastaveni.volne_dny = body.volne_dny; return { ok: true };
    }
    if (p === "/import") { window.dispatchEvent(new CustomEvent("demo-toast", { detail: "V ukázce se soubory nenahrávají – data jsou už načtená" })); return { soubory: [] }; }
    if (p === "/analyza") return { ok: true };
    if (p === "/kostra" && m === "PUT") { ST.kostra = clone(body.mapa); return { ok: true }; }
    if (p === "/kostra/reset") { ST.kostra = clone(RAW.kostra); return { ok: true }; }
    if (p === "/varianty" && m === "POST") {
      const prof = body.profily.filter((x) => RAW.varianty[x]);
      ST.varianty = {}; ST.job = { bezi: true, hotovo: 0, celkem: prof.length, aktualni: RAW.profily[prof[0]]?.nazev, chyba: null };
      prof.forEach((x, i) => setTimeout(() => {
        ST.varianty[x] = clone(RAW.varianty[x]); ST.job.hotovo = i + 1;
        ST.job.aktualni = RAW.profily[prof[i + 1]]?.nazev || ""; if (i + 1 === prof.length) ST.job.bezi = false;
      }, 1300 * (i + 1)));
      return clone(ST.job);
    }
    let mm = p.match(/^\/varianty\/(\w+)\/pouzit$/);
    if (mm) {
      ST.rozpis = clone(RAW.rozpisy[mm[1]]);
      ST.verze.push({ id: ST.verze.length + 1, popis: "Varianta " + RAW.varianty[mm[1]].nazev, vytvoreno: now(), data: clone(ST.rozpis) });
      return { ok: true };
    }
    if (p === "/rozpis" && m === "PUT") {
      const r = ST.rozpis; r.skupiny = clone(body.skupiny);
      const gm = {}; r.skupiny.forEach((g) => { g.kapacita = kap(g.uroven); g.deti.forEach((i) => (gm[i] = g.id)); });
      r.deti.forEach((d) => { const n = gm[d.id] || null; if (n !== (d.skupina || null)) { d.skupina = n; d.stav = n ? "ručně" : "čeká"; } });
      return { kontrola: kontrola(r.skupiny, r.deti, ST.kostra) };
    }
    if (p === "/verze" && m === "POST") { ST.verze.push({ id: ST.verze.length + 1, popis: body.popis || "Ruční uložení", vytvoreno: now(), data: clone(ST.rozpis) }); return { ok: true }; }
    mm = p.match(/^\/verze\/(\d+)\/obnovit$/);
    if (mm) { const v = ST.verze.find((x) => x.id === +mm[1]); ST.rozpis = clone(v.data); return { ok: true }; }
    mm = p.match(/^\/rozhodnuti\/(\d+)$/);
    if (mm) {
      const r = ST.analyza.rozhodnuti.find((x) => x.id === +mm[1]);
      if (!body.volba) Object.assign(r, { stav: "otevřené", volba: null, poznamka: "", kdy: null });
      else {
        Object.assign(r, { stav: "rozhodnuto", volba: body.volba, poznamka: body.poznamka || "", kdy: now() });
        if (r.typ === "trileti") {
          const nova = body.volba.toUpperCase().includes("SAMOST") ? "SAMOSTATNÍ" : "TŘÍLETÍ";
          [ST.analyza.skupiny, ST.rozpis?.skupiny || []].forEach((arr) => arr.forEach((g) => { if (g.id === r.skupina) g.uroven = nova; }));
        }
      }
      return { ok: true };
    }
    throw new Error("V ukázce není k dispozici");
  }

  let komentare = null;
  const k = window.claude?.use ? window.claude.use("comments") : Promise.resolve(null);
  k.then((c) => { komentare = c; }).catch(() => {});

  function poRenderu() {
    const sf = document.getElementById("sideFoot"); if (sf) sf.textContent = "Ukázka k připomínkám · smyšlená jména · nic se neukládá";
    const top = document.getElementById("topActions");
    if (top && !document.getElementById("pripominka")) {
      top.insertAdjacentHTML("afterbegin", `<button class="btn note-btn" id="pripominka" title="Připomínka k této obrazovce">✎ Připomínka</button>`);
      document.getElementById("pripominka").onclick = async () => {
        if (window.SKUPINKY_EMAIL) return pripominkaEmailem();
        const cil = document.getElementById("view");
        if (komentare) {
          try { const r = await komentare.openComposer({ element: cil }); if (r && r.opened === false) zobrazTip(); return; } catch (e) { /* níže tip */ }
        }
        zobrazTip();
      };
    }
  }
  function pripominkaEmailem() {
    const obr = (document.getElementById("title") || {}).textContent || "";
    const adr = window.SKUPINKY_EMAIL;
    window.dialog(`<h2>Připomínka · ${obr}</h2>
      <label for="pTxt">Co je nejasné, chybí nebo by se vám pracovalo jinak?</label>
      <textarea id="pTxt" rows="7" placeholder="Např. Na rozpisu chci vidět i telefon rodiče…"></textarea>
      <label for="pJm">Vaše jméno (nepovinné)</label><input id="pJm">
      <p class="tiny" style="margin-top:10px">Odešle se e-mailem na <b>${adr}</b>. Když se e-mail neotevře, zkopírujte text tlačítkem a pošlete ho jakkoli jinak.</p>
      <div class="dlg-actions"><button class="btn" id="pKop">Zkopírovat text</button><button class="btn" data-close>Zavřít</button><button class="btn primary" id="pPoslat">Odeslat e-mailem</button></div>`);
    const text = () => `Obrazovka: ${obr}\n\n${document.getElementById("pTxt").value}\n\n${document.getElementById("pJm").value}`;
    document.getElementById("pPoslat").onclick = () => {
      if (!document.getElementById("pTxt").value.trim()) { document.getElementById("pTxt").focus(); return; }
      location.href = `mailto:${adr}?subject=${encodeURIComponent("Skupinky – připomínka: " + obr)}&body=${encodeURIComponent(text())}`;
    };
    document.getElementById("pKop").onclick = async () => {
      try { await navigator.clipboard.writeText(text()); window.dispatchEvent(new CustomEvent("demo-toast", { detail: "Text zkopírován" })); }
      catch { document.getElementById("pTxt").select(); }
    };
  }
  function zobrazTip() {
    window.dispatchEvent(new CustomEvent("demo-toast", { detail: "Připomínku napište přes ikonu komentářů nahoře – pak klikněte na místo, ke kterému patří." }));
  }

  window.SKUPINKY_DEMO = { api, poRenderu };
})();
</script>

  ["rozpis", "Rozpis"], ["rozhodnuti", "Rozhodnutí"], ["vystupy", "Výstupy"],

const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const S = { kurzy: [], kid: null, st: null, view: "data", filtr: "vse", hledat: "", rozhFiltr: "otevřené", poll: null };

const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kap = (u) => (u || "").startsWith("POKR") ? 5 : 4;

const den2 = (d) => d.slice(0, 2);
const lbl = (d, t) => d.charAt(0) + d.slice(1).toLowerCase() + " " + (DOP.includes(t) ? "Dopoledne" : "Odpoledne");

const DEMO = window.SKUPINKY_DEMO || null;
async function api(path, opt = {}) {
  if (DEMO) return DEMO.api(path, opt);
  const o = { headers: {}, ...opt };
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers["Content-Type"] = "application/json"; o.method = o.method || "POST"; }
  const r = await fetch(path, o);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

async function nactiStav() {

const deti = () => S.st?.rozpis?.deti || S.st?.analyza?.deti || [];

const katCls = (d) => d.kategorie === "pokračuje" ? "pokr" : d.kategorie === "vrací se" ? "vraci" : "novy";

// ------------------------------------------------------------------ 4 VARIANTY
function vVarianty(v) {
  const a = S.st.analyza;
  if (!a) { v.innerHTML = emptyNeed("Nejdřív nahrajte data", "data", "Nahrát data"); return; }
  const job = S.st.job, P = S.st.profily, V = S.st.varianty || {};
  const bezi = job?.bezi;
  const list = Object.values(V).filter((x) => x.ok);
  const best = list.length ? list.reduce((b, x) => (skore(x) > skore(b) ? x : b)) : null;
  v.innerHTML = `<div class="stack">
    <div class="card"><div class="row"><div><h2 style="margin:0">Optimalizátor kostry</h2><div class="small muted">Pro každý profil najde nejlepší rozmístění skupin a nových dětí. Výpočet ~20 s na variantu.</div></div><span class="spacer"></span>
      <button class="btn primary" id="run" ${bezi ? "disabled" : ""}>${bezi ? `<span class="spin"></span> Počítám ${job.hotovo + 1}/${job.celkem} · ${h(job.aktualni || "")}` : "Navrhni varianty"}</button></div>
      <div class="chips" style="margin-top:14px">${Object.entries(P).map(([k, p]) => `<label class="chip on" title="${h(p.popis)}"><input type="checkbox" data-p="${k}" checked hidden> ${h(p.nazev)}</label>`).join("")}</div>
      ${bezi ? `<div class="progress" style="margin-top:14px"><i style="width:${(job.hotovo / job.celkem) * 100}%"></i></div>` : ""}
      ${job?.chyba ? `<div class="issue chyba" style="margin-top:10px">${h(job.chyba)}</div>` : ""}
    </div>
    ${list.length ? `<div class="vgrid">${list.map((x) => vcard(x, x === best)).join("")}</div>` : `<div class="card empty-state"><h2>Zatím žádné varianty</h2><p>Zkontrolujte kostru a spusťte optimalizátor.</p></div>`}
    ${Object.values(V).filter((x) => !x.ok).map((x) => `<div class="issue chyba">${h(x.nazev)}: ${h(x.chyba)}</div>`).join("")}
  </div>`;
  $$(".chips label").forEach((l) => (l.onclick = (e) => { e.preventDefault(); const c = $("input", l); c.checked = !c.checked; l.classList.toggle("on", c.checked); }));
  $("#run").onclick = async () => {
    const profily = $$("input[data-p]").filter((c) => c.checked).map((c) => c.dataset.p);
    try { await api(`/api/kurzy/${S.kid}/varianty`, { json: { profily, zamky: S.st.kostra?._zamky || [] } }); } catch (e) { return err(e); }
    pollJob();
  };
  $$("[data-detail]").forEach((b) => (b.onclick = () => detailVarianty(V[b.dataset.detail])));
  $$("[data-pouzit]").forEach((b) => (b.onclick = async () => {
    if (S.st.rozpis && !(await ask("Použít tuto variantu?", "Současný rozpis se nahradí. Starý zůstane uložený ve Výstupech → Verze."))) return;
    await api(`/api/kurzy/${S.kid}/varianty/${b.dataset.pouzit}/pouzit`, { method: "POST" }).catch(err);

  }));
  if (bezi && !S.poll) pollJob();
}
const chybyVar = (x) => (x.kontrola || []).filter((k) => k.uroven === "chyba" && !(k.text.includes("překročená") && (x.skupiny.find((g) => g.id === k.skupina) || {}).typ === "pokračuje"));
function skore(x) { const m = x.metriky; return m.m1 * 2 + m.m2 - m.mimo * 2 - m.bez * 10 - m.rodiny_den * 2 - m.rodiny_cas * 0.5 - m.male * 2 - chybyVar(x).length * 5; }
function vcard(x, best) {
  const m = x.metriky, tot = Math.max(m.mimi, 1);
  const ch = chybyVar(x).length, chIn = (x.kontrola || []).filter((k) => k.uroven === "chyba").length - ch;

    <div class="row"><button class="btn sm" data-detail="${x.id}">Detail a změny</button><span class="spacer"></span><button class="btn sm primary" data-pouzit="${x.id}">Použít →</button></div>
  </div>`;
}

async function pollJob() {

// ------------------------------------------------------------------ 5 ROZPIS
const GT = { "nová": "✚", "přesun": "↔", "sloučeno": "⇄" };
function vRozpis(v) {
  const r = S.st.rozpis;

  const dm = dmap(), kon = S.st.kontrola || [];
  const flag = {}; kon.forEach((k) => { if (k.skupina) flag[k.skupina] = flag[k.skupina] === "chyba" ? "chyba" : k.uroven; });
  topBtn(`<button class="btn" id="ulozV">Uložit verzi</button>${DEMO ? `<button class="btn" id="tiskA4">Tisk A4</button>` : `<a class="btn" href="/api/kurzy/${S.kid}/tisk" target="_blank">Tisk A4</a>`}`);
  const kid = (d) => `<li class="kid k-${katCls(d)} ${d.nahradnik ? "sub" : ""}" draggable="true" data-kid="${d.id}" title="${h(d.jmeno)} · ${h(d.kategorie)}${d.puvod ? " · dříve " + h(d.puvod) : ""}${d.p1 ? " · chce " + h(d.p1) : ""}">
      <i class="dot"></i><span class="nm">${h(d.jmeno)}</span>${d.nahradnik ? `<span class="nn">Ⓝ</span>` : ""}<span class="age">${d.vek != null ? Math.round(d.vek) + " m" : ""}</span></li>`;

      const g = r.skupiny.find((g) => g.den === d && g.cas === t);

      if (!g) { cells += c.blokace ? `<div class="slot blok">${h(c.blokace)}</div>` : `<div class="slot empty" data-empty="${d}|${t}" title="Kliknutím založit skupinu"></div>`; return; }

        <div class="gh" data-g="${g.id}"><b>${h(g.uroven)}</b><span class="lek c-${h(g.lektorka)}">${h(g.lektorka)}</span>${g.typ !== "pokračuje" ? `<span class="gtag ${h(g.typ)}" title="${h(g.typ)}${g.pozn ? " · " + h(g.pozn) : ""}">${GT[g.typ] || "•"}</span>` : ""}<span class="cap ${capc}">${n}/${g.kapacita}</span></div>
        <ul data-drop="${g.id}">${g.deti.map((i) => dm[i] ? kid(dm[i]) : "").join("")}</ul></div>`;
    });
  });
  const cek = deti().filter((d) => !d.skupina).sort((a, b) => (!!a.nahradnik - !!b.nahradnik) || a.poradi - b.poradi);
  v.innerHTML = `<div class="stack">
    ${kon.length ? `<div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Kontrola rozpisu</h3><span class="b ${kon.some((k) => k.uroven === "chyba") ? "bad" : "warn"}">${kon.length}</span></div><div class="issues">${kon.map((k) => `<div class="issue ${k.uroven}">${k.uroven === "chyba" ? "✕" : "!"} ${h(k.text)}</div>`).join("")}</div></div>`
      : `<div class="issue" style="background:var(--good-soft);color:var(--good)">✓ Rozpis splňuje všechna pravidla</div>`}
    <div class="board-wrap">
      <div class="card board"><div class="tt-scroll"><div class="tt">${cells}</div></div>
        <div class="legend" style="margin-top:12px"><span><i class="dot" style="background:#cbd5e1"></i>pokračuje</span><span><i class="dot" style="background:var(--ret)"></i>vrací se</span><span><i class="dot" style="background:var(--new)"></i>nový</span><span style="color:var(--sub)">Ⓝ náhradník</span><span class="tiny">Děti přetahujte myší · klik na hlavičku = upravit skupinu · klik na prázdné pole = nová skupina</span></div></div>
      <div class="card waitlist"><h3>Čekající (${cek.length})</h3><div class="tiny" style="margin-bottom:8px">Řádné přihlášky před náhradníky, v pořadí podání. Přetáhněte do skupiny.</div>
        <ul data-drop="">${cek.map((d) => `${kid(d)}<div class="tiny" style="margin:-2px 0 6px 21px">${h(d.kategorie)}${d.p1 ? " · " + h(d.p1) : ""}${d.priznaky?.length ? " · " + h(d.priznaky.join(", ")) : ""}</div>`).join("") || `<li class="tiny">Nikdo nečeká</li>`}</ul></div>
    </div></div>`;
  // drag & drop
  $$(".kid").forEach((el) => {
    el.ondragstart = (e) => { e.dataTransfer.setData("text/plain", el.dataset.kid); el.classList.add("dragging"); };
    el.ondragend = () => el.classList.remove("dragging");
  });
  $$("[data-drop]").forEach((ul) => {
    ul.ondragover = (e) => { e.preventDefault(); ul.classList.add("drop-ok"); };
    ul.ondragleave = () => ul.classList.remove("drop-ok");
    ul.ondrop = (e) => { e.preventDefault(); ul.classList.remove("drop-ok"); presun(e.dataTransfer.getData("text/plain"), ul.dataset.drop || null); };
  });
  $$("[data-g]").forEach((el) => (el.onclick = () => upravSkupinu(r.skupiny.find((g) => g.id === el.dataset.g))));
  $$("[data-empty]").forEach((el) => (el.onclick = () => novaSkupina(el.dataset.empty)));
  if ($("#tiskA4")) $("#tiskA4").onclick = nahledA4;
  $("#ulozV").onclick = async () => { const p = await askText("Uložit verzi", "Popis verze", "Ruční úpravy"); if (p === null) return; await api(`/api/kurzy/${S.kid}/verze`, { json: { popis: p } }); await nactiStav(); toast("Verze uložena"); };
}
async function ulozRozpis(msg) {
  try { const r = await api(`/api/kurzy/${S.kid}/rozpis`, { method: "PUT", json: { skupiny: S.st.rozpis.skupiny } }); S.st.kontrola = r.kontrola; } catch (e) { err(e); }
  await nactiStav(); if (msg) toast(msg);

function presun(id, cil) {
  const r = S.st.rozpis; const d = r.deti.find((x) => x.id === id); if (!d) return;
  r.skupiny.forEach((g) => (g.deti = g.deti.filter((x) => x !== id)));

  d.skupina = cil;
  const g = r.skupiny.find((g) => g.id === cil);
  ulozRozpis(cil ? `${d.jmeno} → ${den2(g.den)} ${g.cas} ${g.uroven}` : `${d.jmeno} → čekající`);
}

    <div class="dlg-actions">${g.deti.length ? "" : `<button class="btn" id="eDel" style="margin-right:auto;color:var(--bad)">Smazat skupinu</button>`}<button class="btn" data-close>Zrušit</button><button class="btn primary" data-ok>Uložit</button></div>`,

}
function novaSkupina(key) {
  const [d, t] = key.split("|"); const L = lektorky(); const lk = S.st.kostra?.[key]?.lektorka;

}
function askText(titul, label, def) {

function nahledA4() {

  dialog(`<div class="row"><h2 style="margin:0">Náhled tisku A4</h2><span class="spacer"></span><span class="tiny">Ve skutečné aplikaci se otevře tiskový dialog · jeden list na šířku</span></div>
    <div class="a4wrap"><div class="a4"><div class="a4t"><b>${h(S.st.kurz.nazev)}</b><span>začátek ${fmtD(S.st.kurz.zacatek)} · zelená = nový / vrací se · oranžová Ⓝ = náhradník</span></div>
    <table><thead><tr><th></th>${DNY.map((d) => `<th>${d}</th>`).join("")}</tr></thead><tbody>${CASY.map((t) => `<tr><th>${t}</th>${DNY.map((d) => cell(d, t)).join("")}</tr>`).join("")}</tbody></table></div></div>
    <div class="dlg-actions"><button class="btn primary" data-close>Zavřít</button></div>`);
}

// ------------------------------------------------------------------ dialog
function dialog(html, onOk) {
  const d = $("#dlg"); d.innerHTML = html; d.showModal();
  $$("[data-close]", d).forEach((b) => (b.onclick = () => d.close()));
  const ok = $("[data-ok]", d); if (ok) ok.onclick = () => { d.close(); onOk && onOk(); };
}
function novyKurz() {
  const y = new Date().getFullYear();
  dialog(`<h2>Nový kurz</h2><label>Název</label><input id="nkN" placeholder="Zima ${y}">
    <label>Datum první lekce</label><input id="nkD" type="date">
    <div class="dlg-actions"><button class="btn" data-close>Zrušit</button><button class="btn primary" data-ok>Založit</button></div>`,
    async () => {
      const n = $("#nkN").value.trim() || `Kurz ${y}`, z = $("#nkD").value; if (!z) return toast("Zadejte datum první lekce");
      const r = await api("/api/kurzy", { json: { nazev: n, zacatek: z } }); S.kid = r.id; ls.set("kid", r.id);
      await nactiKurzy(); await nactiStav(); go("data");
    });
}

// ------------------------------------------------------------------ start
$("#novyKurz").onclick = novyKurz;
$("#kurzSelect").onchange = async (e) => { S.kid = +e.target.value; ls.set("kid", S.kid); await nactiStav(); };
window.addEventListener("hashchange", () => { const v = location.hash.slice(2); if (VIEWS.some((x) => x[0] === v) && v !== S.view) { S.view = v; render(); } });
(async () => {
  const v = location.hash.slice(2); if (VIEWS.some((x) => x[0] === v)) S.view = v;
  try { await nactiKurzy(); await nactiStav(); } catch (e) { err(e); }
})();
</script>
